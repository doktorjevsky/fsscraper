  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    padding: 0;

  }

  }
  .popup-card {
    padding: 16px;
  }
  .popup-area {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    margin-bottom: 6px;
  }
  .popup-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    gap: 10px;
  }
  .popup-title {
    font-size: 15px;
    font-weight: 700;
    color: #111827;
    line-height: 1.3;
    flex: 1;
  }
  .popup-score-badge {
    font-size: 16px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 20px;
    color: white;
    white-space: nowrap;
  }
  .popup-meta {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid #e5e7eb;
  }
  .popup-meta-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .popup-meta-label {
    font-size: 11px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .popup-meta-value {
    font-size: 13px;
    font-weight: 600;
    color: #111827;
  }
  .popup-scores-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    margin-bottom: 8px;
  }
  .popup-score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
  }
  .popup-score-row:last-child {
    border-bottom: none;
  }
  .popup-score-name {
    color: #374151;
    line-height: 1.3;
    flex: 1;
    padding-right: 8px;
  }
  .popup-score-value {
    font-weight: 700;
    font-size: 13px;
    color: #111827;
    min-width: 32px;
    text-align: right;
  }
  .popup-hint {
    margin-top: 12px;
    font-size: 11px;
    color: #6b7280;
    font-style: italic;
  }
  #legend {
    position: absolute;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    background: white;
    padding: 14px 18px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    font-size: 13px;
  }
  #legend h4 {
    margin-bottom: 10px;
    font-size: 14px;
    color: #111827;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
  }
  .legend-label { color: #4b5563; }
</style>

const map = L.map('map').setView([57.7, 11.97], 11);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const markers = [];

function formatScore(val) {
  if (val === null || val === undefined) return '—';
  return parseFloat(val).toFixed(2);
}

function scoreColor(val) {
  if (val === null || val === undefined) return '#9ca3af';
  const v = parseFloat(val);
  if (v >= 4.5) return '#16a34a';
  if (v >= 4.0) return '#2563eb';
  if (v >= 3.5) return '#eab308';
  return '#dc2626';
}

for (const p of data) {
  const overallText = formatScore(p.overall);
  const overallBg = p.color;

  let scoresHtml = '';
  for (const [cat, val] of Object.entries(p.scores)) {
    if (cat === 'Helhetsomdöme') continue; // shown separately
    const valText = formatScore(val);
    const valColor = scoreColor(val);
    scoresHtml += `
      <div class="popup-score-row">
        <span class="popup-score-name">${cat}</span>
        <span class="popup-score-value" style="color:${valColor}">${valText}</span>
      </div>
    `;
  }

  const popupContent = `
    <div class="popup-card">
      <div class="popup-area">${p.area}</div>
      <div class="popup-header">
        <div class="popup-title">${p.name}</div>
        <div class="popup-score-badge" style="background:${overallBg}">${overallText}</div>
      </div>
      <div class="popup-meta">
        <div class="popup-meta-item">
          <span class="popup-meta-label">År</span>
          <span class="popup-meta-value">${p.year}</span>
        </div>
        <div class="popup-meta-item">
          <span class="popup-meta-label">Svarsfrekvens</span>
          <span class="popup-meta-value">${p.response_rate !== null ? p.response_rate + '%' : '—'}</span>
        </div>
      </div>
      <div class="popup-scores-title">Omdömen per område</div>
      ${scoresHtml}
      <div class="popup-hint">Klicka på pricken för att öppna enkäten (PDF)</div>
    </div>
  `;

  const popup = L.popup({
    closeButton: false,
    offset: [0, -6],
    className: 'preschool-popup'
  }).setContent(popupContent);

  const circle = L.circleMarker([p.lat, p.lng], {
    radius: 8,
    fillColor: p.color,
    color: "#fff",
    weight: 2,
    opacity: 1,
    fillOpacity: 0.9
  }).addTo(map);

  circle.on('mouseover', function () {
    popup.setLatLng(this.getLatLng()).openOn(map);
  });

  circle.on('mouseout', function () {
    map.closePopup(popup);
  });

  circle.on('click', function () {
    window.open(p.pdf_url, '_blank', 'noopener,noreferrer');
  });

  markers.push(circle);
}

if (markers.length > 0) {
  const group = new L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.1));
}
</script>
