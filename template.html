  <script>
    const schools=SCHOOL_DATA;
    let addressData=ADDRESS_DATA;
    const mapWidth=MAP_WIDTH;
    const mapHeight=MAP_HEIGHT;
    const bounds={minLon:MAP_MIN_LON,minLat:MAP_MIN_LAT,maxLon:MAP_MAX_LON,maxLat:MAP_MAX_LAT};
    const svg=document.getElementById('map');
    const popup=document.getElementById('popup');
    const originPopup=document.getElementById('origin-popup');
    document.addEventListener('touchmove',event=>{if(event.touches.length>1)event.preventDefault()},{passive:false});

    const color=score=>score>=4.5?'#16834b':score>=4?'#dfa900':'#c9463d';
    const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    class OfflineMap{
      constructor(){this.view={x:0,y:0,w:mapWidth,h:mapHeight};this.zoom=1;this.markers=[...document.querySelectorAll('.marker')];this.pointers=new Map();this.drag=null;this.pinch=null;this.suppressClicksUntil=0;this.locationMarker=null;this.animationFrame=null;this.renderFrame=null;this.markerRadius=null;this.enhanceMarkers();this.reset();this.bind()}
      enhanceMarkers(){this.markers.forEach(marker=>{const school=schools[Number(marker.dataset.index)];marker.addEventListener('pointerenter',event=>{if(event.pointerType==='mouse')showPopup(school,marker)});marker.addEventListener('pointerleave',event=>{if(event.pointerType==='mouse'&&activeMarker===marker)hidePopup()});marker.addEventListener('pointerup',event=>{if(event.pointerType!=='mouse'&&performance.now()>=this.suppressClicksUntil){marker.dataset.touchTap='1';showPopup(school,marker)}});marker.addEventListener('focus',()=>showPopup(school,marker));marker.addEventListener('blur',event=>{if(activeMarker===marker&&!popup.contains(event.relatedTarget))hidePopup()});marker.addEventListener('click',event=>{if(marker.dataset.touchTap){delete marker.dataset.touchTap;event.preventDefault();event.stopPropagation();showPopup(school,marker)}})})}
      apply(){svg.setAttribute('viewBox',`${this.view.x} ${this.view.y} ${this.view.w} ${this.view.h}`);const unitsPerPixel=this.view.w/Math.max(1,svg.getBoundingClientRect().width);const mobile=matchMedia('(max-width: 720px)').matches;const markerRadius=(mobile?8:5.2)*unitsPerPixel;if(markerRadius!==this.markerRadius){for(const marker of this.markers)marker.setAttribute('r',markerRadius);this.markerRadius=markerRadius}if(this.locationMarker){this.locationMarker.ring.setAttribute('r',12*unitsPerPixel);this.locationMarker.dot.setAttribute('r',(mobile?7:5.5)*unitsPerPixel)}positionPopup();positionOriginPopup()}
      requestApply(){if(this.renderFrame===null)this.renderFrame=requestAnimationFrame(()=>{this.renderFrame=null;this.apply()})}
      aspect(){const rect=svg.getBoundingClientRect();return Math.max(.1,rect.width/Math.max(1,rect.height))}
      safeInsets(){const rect=svg.getBoundingClientRect();const toolbar=document.querySelector('.toolbar').getBoundingClientRect();return{top:Math.min(rect.height*.38,toolbar.bottom+12),right:12,bottom:12,left:12}}
      minimumZoom(){const rect=svg.getBoundingClientRect(),insets=this.safeInsets();const scale=(rect.height-insets.top-insets.bottom)/mapHeight;return Math.max(.1,mapWidth*scale/Math.max(1,rect.width))}
      sizeAtZoom(zoom){const w=mapWidth/zoom;return{w,h:w/this.aspect()}}
      setZoom(next,anchor={x:this.view.x+this.view.w/2,y:this.view.y+this.view.h/2}){if(this.animationFrame)cancelAnimationFrame(this.animationFrame);const zoom=Math.max(this.minimumZoom(),Math.min(14,next));const rx=(anchor.x-this.view.x)/this.view.w;const ry=(anchor.y-this.view.y)/this.view.h;const {w,h}=this.sizeAtZoom(zoom);this.view={x:anchor.x-rx*w,y:anchor.y-ry*h,w,h};this.zoom=zoom;this.constrain();this.apply()}
      reset(){this.zoom=this.minimumZoom();const {w,h}=this.sizeAtZoom(this.zoom);const rect=svg.getBoundingClientRect(),insets=this.safeInsets(),unitsPerPixel=w/Math.max(1,rect.width);const availableWidth=rect.width-insets.left-insets.right,availableHeight=rect.height-insets.top-insets.bottom;const mapScreenWidth=mapWidth/unitsPerPixel,mapScreenHeight=mapHeight/unitsPerPixel;const mapLeft=insets.left+(availableWidth-mapScreenWidth)/2,mapTop=insets.top+(availableHeight-mapScreenHeight)/2;this.view={x:-mapLeft*unitsPerPixel,y:-mapTop*unitsPerPixel,w,h};this.constrain();this.apply()}
      resize(){const center={x:this.view.x+this.view.w/2,y:this.view.y+this.view.h/2};this.zoom=Math.max(this.minimumZoom(),this.zoom);const {w,h}=this.sizeAtZoom(this.zoom);this.view={x:center.x-w/2,y:center.y-h/2,w,h};this.constrain();this.apply()}
      centerAt(x,y,zoom=Math.max(this.zoom,6),animate=false){const targetZoom=Math.max(this.minimumZoom(),Math.min(14,zoom));const target=this.sizeAtZoom(targetZoom);target.x=Math.max(0,Math.min(mapWidth-target.w,x-target.w/2));target.y=Math.max(0,Math.min(mapHeight-target.h,y-target.h/2));if(!animate||matchMedia('(prefers-reduced-motion: reduce)').matches){this.view=target;this.zoom=targetZoom;this.apply();return}if(this.animationFrame)cancelAnimationFrame(this.animationFrame);const start={...this.view};const started=performance.now();const frame=now=>{const progress=Math.min(1,(now-started)/520);const eased=1-(1-progress)**3;this.view={x:start.x+(target.x-start.x)*eased,y:start.y+(target.y-start.y)*eased,w:start.w+(target.w-start.w)*eased,h:start.h+(target.h-start.h)*eased};this.zoom=mapWidth/this.view.w;this.apply();if(progress<1)this.animationFrame=requestAnimationFrame(frame);else this.animationFrame=null};this.animationFrame=requestAnimationFrame(frame)}
      showLocation(x,y,radius=0,animate=false){
        if(!this.locationMarker){const namespace='http://www.w3.org/2000/svg';const group=document.createElementNS(namespace,'g');const radiusCircle=document.createElementNS(namespace,'circle');const ring=document.createElementNS(namespace,'circle');const dot=document.createElementNS(namespace,'circle');radiusCircle.setAttribute('class','user-radius');ring.setAttribute('class','user-location-ring');dot.setAttribute('class','user-location-dot');dot.addEventListener('pointerenter',showOriginPopup);dot.addEventListener('pointerleave',hideOriginPopup);group.append(radiusCircle,ring,dot);document.getElementById('viewport').append(group);this.locationMarker={group,radiusCircle,ring,dot}}
        for(const element of [this.locationMarker.radiusCircle,this.locationMarker.ring,this.locationMarker.dot]){element.setAttribute('cx',x);element.setAttribute('cy',y)}
        if(animate){this.locationMarker.group.classList.remove('location-arrived');void this.locationMarker.group.getBoundingClientRect();this.locationMarker.group.classList.add('location-arrived')}

      }
      mapUnitsPerKm(){return mapWidth/((bounds.maxLon-bounds.minLon)*111.32*Math.cos((bounds.minLat+bounds.maxLat)/2*Math.PI/180))}
      setLocationRadius(radius){if(!this.locationMarker)return;this.locationMarker.radiusCircle.setAttribute('r',radius*this.mapUnitsPerKm());this.locationMarker.radiusCircle.style.display=radius?'':'none'}
      constrain(){const rect=svg.getBoundingClientRect(),insets=this.safeInsets(),unitsPerPixel=this.view.w/Math.max(1,rect.width);const xBounds=[-insets.left*unitsPerPixel,mapWidth-this.view.w+insets.right*unitsPerPixel].sort((a,b)=>a-b);const yBounds=[-insets.top*unitsPerPixel,mapHeight-this.view.h+insets.bottom*unitsPerPixel].sort((a,b)=>a-b);this.view.x=Math.max(xBounds[0],Math.min(xBounds[1],this.view.x));this.view.y=Math.max(yBounds[0],Math.min(yBounds[1],this.view.y))}

      clientPoint(x,y){const point=svg.createSVGPoint();point.x=x;point.y=y;return point.matrixTransform(svg.getScreenCTM().inverse())}
      beginDrag(pointer){this.drag={id:pointer.id,x:pointer.x,y:pointer.y,viewX:this.view.x,viewY:this.view.y};this.pinch=null;svg.classList.add('dragging')}
      beginPinch(){const pointers=[...this.pointers.values()].slice(0,2);const center={x:(pointers[0].x+pointers[1].x)/2,y:(pointers[0].y+pointers[1].y)/2};this.pinch={distance:Math.hypot(pointers[1].x-pointers[0].x,pointers[1].y-pointers[0].y),zoom:this.zoom,anchor:this.clientPoint(center.x,center.y)};this.drag=null;this.suppressClicksUntil=performance.now()+700;svg.classList.add('dragging')}

        svg.addEventListener('wheel',event=>{event.preventDefault();this.setZoom(this.zoom*(event.deltaY<0?1.35:1/1.35),this.point(event))},{passive:false});
        svg.addEventListener('pointerdown',event=>{const pointer={id:event.pointerId,x:event.clientX,y:event.clientY};this.pointers.set(event.pointerId,pointer);if(this.pointers.size===1)this.suppressClicksUntil=0;if(this.pointers.size===2){for(const id of this.pointers.keys())svg.setPointerCapture(id);this.beginPinch();hidePopup();hideOriginPopup();return}if(event.target.classList.contains('marker')||event.target.classList.contains('user-location-dot'))return;svg.setPointerCapture(event.pointerId);this.beginDrag(pointer);hidePopup();hideOriginPopup()});
        svg.addEventListener('pointermove',event=>{const pointer=this.pointers.get(event.pointerId);if(!pointer)return;pointer.x=event.clientX;pointer.y=event.clientY;if(this.pinch&&this.pointers.size>=2){const pointers=[...this.pointers.values()].slice(0,2);const center={x:(pointers[0].x+pointers[1].x)/2,y:(pointers[0].y+pointers[1].y)/2};const distance=Math.hypot(pointers[1].x-pointers[0].x,pointers[1].y-pointers[0].y);const zoom=Math.max(this.minimumZoom(),Math.min(14,this.pinch.zoom*distance/Math.max(1,this.pinch.distance)));const rect=svg.getBoundingClientRect();const {w,h}=this.sizeAtZoom(zoom);this.view={x:this.pinch.anchor.x-(center.x-rect.left)/rect.width*w,y:this.pinch.anchor.y-(center.y-rect.top)/rect.height*h,w,h};this.zoom=zoom;this.constrain();this.requestApply();return}if(!this.drag||this.drag.id!==event.pointerId)return;const rect=svg.getBoundingClientRect();const dx=event.clientX-this.drag.x,dy=event.clientY-this.drag.y;if(Math.hypot(dx,dy)>4)this.suppressClicksUntil=performance.now()+700;this.view.x=this.drag.viewX-dx*this.view.w/rect.width;this.view.y=this.drag.viewY-dy*this.view.h/rect.height;this.constrain();this.requestApply()});
        const endPointer=event=>{this.pointers.delete(event.pointerId);if(this.pinch){this.pinch=null;const remaining=[...this.pointers.values()][0];if(remaining)this.beginDrag(remaining)}else if(this.drag?.id===event.pointerId)this.drag=null;if(!this.pointers.size){this.drag=null;svg.classList.remove('dragging')}};
        svg.addEventListener('pointerup',endPointer);
        svg.addEventListener('pointercancel',endPointer);
        svg.addEventListener('click',event=>{if(performance.now()<this.suppressClicksUntil){event.preventDefault();event.stopPropagation();return}if(!event.target.classList.contains('marker'))hidePopup()});
      }
    }

    let activeMarker=null;
    let userLocation=null;
    let originLabel='Vald plats';
    function showPopup(school,marker){
      if(activeMarker)activeMarker.classList.remove('active');activeMarker=marker;marker.classList.add('active');
      const distance=userLocation?distanceKm(userLocation,school):null;const distanceText=distance===null?'':`<span class="distance">${distance<1?`${Math.round(distance*1000)} m`:`${distance.toFixed(1).replace('.',',')} km`} från ${escapeHtml(originLabel)}</span>`;
      popup.innerHTML=`<div class="area">${escapeHtml(school.area)}</div><div class="name">${escapeHtml(school.name)}</div><span class="score" style="background:${color(school.score)}">${school.score.toFixed(2).replace('.',',')}</span><span class="meta">Svarsfrekvens ${school.response_rate}%</span>${distanceText}<div class="hint">Klicka på markören för att öppna enkäten</div><a class="survey-link" href="${escapeHtml(school.source_url)}" target="_blank" rel="noopener">Öppna enkäten</a>`;
      popup.querySelector('.survey-link').onclick=event=>{event.preventDefault();const link=event.currentTarget;link.textContent='Öppnar…';link.setAttribute('aria-busy','true');const surveyTab=window.open('about:blank','_blank');if(surveyTab){surveyTab.opener=null;surveyTab.location.replace(school.source_url)}else{link.textContent='Tillåt popup-fönster';link.removeAttribute('aria-busy')}};
      popup.classList.add('visible');positionPopup();
    }
    function positionPopup(){if(!activeMarker||!popup.classList.contains('visible'))return;const point=svg.createSVGPoint();point.x=Number(activeMarker.getAttribute('cx'));point.y=Number(activeMarker.getAttribute('cy'));const screen=point.matrixTransform(svg.getScreenCTM());const half=popup.offsetWidth/2;popup.style.left=`${Math.max(half+8,Math.min(innerWidth-half-8,screen.x))}px`;popup.style.top=`${Math.max(popup.offsetHeight+18,screen.y)}px`}
    function hidePopup(){popup.classList.remove('visible');if(activeMarker)activeMarker.classList.remove('active');activeMarker=null}
    function showOriginPopup(){if(!userLocation)return;originPopup.innerHTML=`<strong>${escapeHtml(originLabel)}</strong><span>${userLocation.lat.toFixed(5)}, ${userLocation.lng.toFixed(5)}</span>`;originPopup.classList.add('visible');positionOriginPopup()}
    function positionOriginPopup(){if(!userLocation||!originPopup.classList.contains('visible'))return;const point=svg.createSVGPoint();point.x=userLocation.x;point.y=userLocation.y;const screen=point.matrixTransform(svg.getScreenCTM());const half=originPopup.offsetWidth/2;originPopup.style.left=`${Math.max(half+8,Math.min(innerWidth-half-8,screen.x))}px`;originPopup.style.top=`${Math.max(originPopup.offsetHeight+18,screen.y)}px`}
    function hideOriginPopup(){originPopup.classList.remove('visible')}

    const gbgMap=window.gbgMap=new OfflineMap();
    const projectLocation=(longitude,latitude)=>({x:(longitude-bounds.minLon)/(bounds.maxLon-bounds.minLon)*mapWidth,y:(bounds.maxLat-latitude)/(bounds.maxLat-bounds.minLat)*mapHeight});
    const distanceKm=(a,b)=>{const radians=value=>value*Math.PI/180;const dLat=radians(b.lat-a.lat);const dLon=radians(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(radians(a.lat))*Math.cos(radians(b.lat))*Math.sin(dLon/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))};
    const locationButton=document.getElementById('locate');
    const locationMessage=document.getElementById('location-message');
    const addressToggle=document.getElementById('address-toggle');
    const addressPanel=document.getElementById('address-panel');
    const addressForm=document.getElementById('address-form');
    const addressInput=document.getElementById('address-input');
    const addressResults=document.getElementById('address-results');
    const radiusFilter=document.getElementById('radius-filter');
    const radiusValue=document.getElementById('radius-value');
    const responseFilter=document.getElementById('response-filter');
    const responseValue=document.getElementById('response-value');
    let activeScoreBand='all';
    let activeRadius=0;
    let minimumResponse=0;
    let locationMessageTimer;
    let addressSearchTimer;
    let addressDataPromise;
    let localAddresses=null;
    let exactAddresses=null;
    const formatRadius=value=>!value?'Alla':value<1?`${Math.round(value*1000)} m`:`${String(Number(value.toFixed(2))).replace('.',',')} km`;
    const normalizeAddress=value=>value.toLocaleLowerCase('sv-SE').normalize('NFKC').split(',')[0].replace(/\b\d{3}\s?\d{2}\b/g,' ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
    async function ensureAddressIndex(){
      if(localAddresses)return;
      if(!addressData){
        addressDataPromise??=fetch('addresses.json').then(response=>{if(!response.ok)throw new Error(`Kunde inte läsa adresser (${response.status})`);return response.json()});
        addressData=await addressDataPromise;
      }
      localAddresses=addressData.addresses.map(([streetId,number,lng,lat])=>{const label=`${addressData.streets[streetId]} ${number}`;return{key:normalizeAddress(label),label,lng,lat}});
      exactAddresses=new Map(localAddresses.map(address=>[address.key,address]));
    }
    function animateValue(element){element.classList.remove('value-changed');void element.offsetWidth;element.classList.add('value-changed')}
    function useMapLocation(lat,lng,label,message){const point=projectLocation(lng,lat);originLabel=label;userLocation={lat,lng,...point};hideOriginPopup();gbgMap.showLocation(point.x,point.y,activeRadius,true);applyFilters();if(activeMarker)showPopup(schools[Number(activeMarker.dataset.index)],activeMarker);reportLocation(message)}
    function resetRadiusFilter(){activeRadius=0;radiusFilter.value='0';radiusFilter.style.setProperty('--fill','0%');radiusValue.textContent='Alla';gbgMap.setLocationRadius(0);applyFilters()}
    function reportLocation(message,isError=false){clearTimeout(locationMessageTimer);locationMessage.textContent=message;locationMessage.style.color=isError?'#9b312c':'';locationMessage.classList.add('visible');locationMessageTimer=setTimeout(()=>locationMessage.classList.remove('visible'),4000)}
    function requestLocation(){
      if(locationButton.disabled)return;
      if(!navigator.geolocation){resetRadiusFilter();reportLocation('Din webbläsare stöder inte platsvisning.',true);return}
      locationButton.disabled=true;locationButton.title='Hämtar din plats…';
      navigator.geolocation.getCurrentPosition(position=>{locationButton.disabled=false;locationButton.title='Centrera på min plats';useMapLocation(position.coords.latitude,position.coords.longitude,'Min plats',activeRadius?`Visar förskolor inom ${formatRadius(activeRadius)}.`:'Din plats visas på kartan.')},error=>{locationButton.disabled=false;locationButton.title='Visa min plats';if(activeRadius)resetRadiusFilter();reportLocation(error.code===1?'Platsåtkomst nekades. Tillåt plats i webbläsaren och försök igen.':'Det gick inte att hämta din plats.',true)},{enableHighAccuracy:true,timeout:10000,maximumAge:60000});
    }
    locationButton.onclick=()=>{addressPanel.classList.remove('open');addressToggle.setAttribute('aria-expanded','false');requestLocation()};
    addressToggle.setAttribute('aria-expanded','false');
    addressToggle.onclick=async()=>{const open=!addressPanel.classList.contains('open');addressPanel.classList.toggle('open',open);addressToggle.setAttribute('aria-expanded',String(open));locationMessage.classList.remove('visible');if(open){renderAddressResults([],'Läser in adresser…');try{await ensureAddressIndex();if(addressPanel.classList.contains('open')){addressResults.replaceChildren();addressInput.focus()}}catch(error){renderAddressResults([],error.message)}}};
    function selectAddress(address){addressInput.value=address.label;addressPanel.classList.remove('open');addressToggle.setAttribute('aria-expanded','false');useMapLocation(address.lat,address.lng,address.label,`Utgångspunkt: ${address.label}.`)}
    function renderAddressResults(matches,message=''){
      addressResults.replaceChildren();
      if(message){const empty=document.createElement('div');empty.className='address-empty';empty.textContent=message;addressResults.append(empty);return}
      matches.forEach(address=>{const button=document.createElement('button');button.type='button';button.className='address-result';button.textContent=address.label;button.onclick=()=>selectAddress(address);addressResults.append(button)});
    }
    function findAddressMatches(query){
      const tokens=query.split(' '),matches=[],seen=new Set();
      for(const address of localAddresses){if(address.key.startsWith(query)){matches.push(address);seen.add(address);if(matches.length===8)return matches}}
      for(const address of localAddresses){if(!seen.has(address)&&tokens.every(token=>address.key.includes(token))){matches.push(address);if(matches.length===8)break}}
      return matches;
    }
    async function suggestAddresses(){await ensureAddressIndex();const query=normalizeAddress(addressInput.value);if(query.length<3){addressResults.replaceChildren();return}const matches=findAddressMatches(query);renderAddressResults(matches,matches.length?'':'Ingen adress hittades i kartområdet.')}
    addressInput.addEventListener('input',()=>{clearTimeout(addressSearchTimer);addressSearchTimer=setTimeout(()=>suggestAddresses().catch(error=>renderAddressResults([],error.message)),100)});
    addressForm.addEventListener('submit',async event=>{
      event.preventDefault();try{await ensureAddressIndex()}catch(error){renderAddressResults([],error.message);return}const query=normalizeAddress(addressInput.value);
      if(query.length<3){renderAddressResults([],'Skriv minst tre tecken.');return}
      const exact=exactAddresses.get(query);if(exact){selectAddress(exact);return}
      const matches=findAddressMatches(query);renderAddressResults(matches,matches.length?'':'Ingen adress hittades i kartområdet.');
    });
    function applyFilters(){
      let visible=0;
      gbgMap.markers.forEach(marker=>{const school=schools[Number(marker.dataset.index)];const scoreMatch=activeScoreBand==='all'||activeScoreBand==='high'&&school.score>=4.5||activeScoreBand==='medium'&&school.score>=4&&school.score<4.5||activeScoreBand==='low'&&school.score<4;const radiusMatch=!activeRadius||userLocation&&distanceKm(userLocation,school)<=activeRadius;const responseMatch=!minimumResponse||school.response_rate>=minimumResponse;const show=scoreMatch&&radiusMatch&&responseMatch;marker.closest('a').style.display=show?'':'none';if(show)visible++;else if(activeMarker===marker)hidePopup()});
      const filterNumber=document.getElementById('filter-number');if(filterNumber.textContent!==String(visible)){filterNumber.textContent=visible;animateValue(filterNumber)}
      document.querySelectorAll('.filter-button').forEach(button=>button.classList.toggle('active',button.dataset.band===activeScoreBand));
    }
    document.querySelectorAll('.filter-button').forEach(button=>button.addEventListener('click',()=>{activeScoreBand=button.dataset.band;applyFilters()}));
    radiusFilter.addEventListener('input',()=>{activeRadius=Number(radiusFilter.value);radiusValue.textContent=formatRadius(activeRadius);animateValue(radiusValue);radiusFilter.style.setProperty('--fill',`${activeRadius/20*100}%`);if(userLocation){if(activeRadius)gbgMap.showLocation(userLocation.x,userLocation.y,activeRadius);else gbgMap.setLocationRadius(0);applyFilters();reportLocation(activeRadius?`Visar förskolor inom ${formatRadius(activeRadius)}.`:'Visar alla avstånd.')}else if(activeRadius)requestLocation();else applyFilters()});
    responseFilter.addEventListener('input',()=>{minimumResponse=Number(responseFilter.value);responseValue.textContent=minimumResponse?`≥ ${minimumResponse} %`:'Alla';animateValue(responseValue);responseFilter.style.setProperty('--fill',`${minimumResponse}%`);applyFilters()});
    document.getElementById('zoom-in').onclick=()=>gbgMap.setZoom(gbgMap.zoom*1.5);
    document.getElementById('zoom-out').onclick=()=>gbgMap.setZoom(gbgMap.zoom/1.5);
    addEventListener('resize',()=>{gbgMap.resize();positionPopup();positionOriginPopup()});addEventListener('keydown',event=>{if(event.key==='Escape'){hidePopup();hideOriginPopup();addressPanel.classList.remove('open');addressToggle.setAttribute('aria-expanded','false')}});
  </script>
</body>
</html>
